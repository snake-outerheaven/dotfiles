# Define a paleta padrão como a personalizada abaixo
palette = "solarized_light"

# Customização básica dos módulos (sugestão de estilo limpo)
[directory]
style = "blue bold"

[git_branch]
symbol = "🌱 "
style = "magenta bold"

[git_status]
style = "red bold"

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"

# Definição oficial das cores do Solarized Light mapeadas para o Starship
[palettes.solarized_light]
# Tons de Fundo e Texto Principais (Monotones)
base03  = "#002b36"
base02  = "#073642"
base01  = "#586e75"
base00  = "#657b83"
base0   = "#839496"
base1   = "#93a1a1"
base2   = "#eee8d5" # Cor de fundo secundária
base3   = "#fdf6e3" # Cor de fundo principal (Cream paper)

# Cores de Destaque (Accent Colors)
yellow  = "#b58900"
orange  = "#cb4b16"
red     = "#dc322f"
magenta = "#d33682"
violet  = "#6c71c4"
blue    = "#268bd2"
cyan    = "#2aa198"
green   = "#859900"

