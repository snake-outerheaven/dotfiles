# Paleta Gruvbox escura (mesma do dwm, do terminal e do tmux; ver CORES.md)
palette = "gruvbox_dark"

# Customização básica dos módulos
[directory]
style = "blue bold"

[git_branch]
symbol = "🌱 "
style = "purple bold"

[git_status]
style = "red bold"

[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"

# Cores oficiais do Gruvbox dark (variantes claras para texto sobre fundo escuro)
[palettes.gruvbox_dark]
bg0    = "#282828"
bg1    = "#3c3836"
bg2    = "#504945"
fg     = "#ebdbb2"
gray   = "#928374"
red    = "#fb4934"
green  = "#b8bb26"
yellow = "#fabd2f"
blue   = "#83a598"
purple = "#d3869b"
aqua   = "#8ec07c"
orange = "#fe8019"
